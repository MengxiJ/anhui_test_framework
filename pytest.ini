[pytest]
# 原子化项目：workflow 用例通过 --tblocks-workflows 指定目录收集，例如：
#   pytest --tblocks-workflows tblocks/workflows/portal
addopts = -s -p tblocks.utils.pytest_tblocks_plugin --alluredir output/allure/results --clean-alluredir
# 隔离：不递归收集旧框架归档目录、虚拟环境与产物目录
norecursedirs = old_framework .venv .* output 实习公司框架
python_files = test_*.py
python_classes = Test*
python_functions = test*
